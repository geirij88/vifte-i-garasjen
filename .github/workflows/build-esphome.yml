name: Build ESPHome Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ESPHome secrets
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          API_ENCRYPTION_KEY: ${{ secrets.API_ENCRYPTION_KEY }}
          FALLBACK_AP_PASSWORD: ${{ secrets.FALLBACK_AP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import json

          names = [
              "WIFI_SSID",
              "WIFI_PASSWORD",
              "API_ENCRYPTION_KEY",
              "FALLBACK_AP_PASSWORD",
          ]

          missing = [n for n in names if not os.environ.get(n)]
          if missing:
              raise SystemExit("Missing GitHub secrets: " + ", ".join(missing))

          with open("secrets.yaml", "w") as f:
              for name in names:
                  f.write(name.lower() + ": " + json.dumps(os.environ[name]) + "\n")
          PY

      - name: Compile ESPHome
        run: |
          docker run --rm \
            -v "$PWD:/config" \
            ghcr.io/esphome/esphome:2026.10.0 \
            compile /config/vifte-i-garasjen.yaml

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: vifte-i-garasjen-firmware
          path: .esphome/build/**/firmware*.bin
          if-no-files-found: error
          retention-days: 14
